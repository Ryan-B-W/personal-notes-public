<h1 class="title">Vi</h1>
<p>
An old visual text editor using modal editing.  Long popular as a rival to <a href="20240714174616-emacs.html#ID-aca1324c-b142-4e34-a121-a8bb0a79ddf8">Emacs</a>.  Long since supplanted by <a href="20240718201007-vim.html#ID-37c53f5b-c586-41ff-a4fe-b44c05ed3c1f">Vim</a>.  Famed for the "h", "j", "k", and "l" navigation keys and so-called "Vi(m) motions".
</p>
