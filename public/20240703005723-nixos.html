<h1 class="title">NixOS</h1>
<p>
NixOS is a <a href="20240714180324-linux.html#ID-bf0bc2d7-17df-413c-823b-93904faffc58">Linux</a> distribution that uses the <a href="20240703005926-nix.html#ID-3b6a267c-90c9-491e-89d2-42c365ec6574">Nix</a> package manager.  Primary distinguishing characteristics are having a reproducible package set and configuration using the Nix configuration <a href="20240714174950-programming_language.html#ID-b24601aa-09df-41e1-aa7e-25ead342db34">language</a> along with the Nix package manager.
</p>
